name: Release APK

# 发布版本时自动构建 APK：
#  - 在 GitHub 上创建并发布 Release（published）时触发；
#  - 推送 v* 标签时触发；
#  - 也可在 Actions 页面手动触发（workflow_dispatch）。
on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          # GitHub ubuntu runner 预装了 Android SDK，直接用并补齐本项目需要的组件，
          # 避免第三方 setup action 因下载 cmdline-tools 失败导致整个构建挂掉。
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Prepare artifact
        id: prep
        run: |
          VERSION="${{ github.event.release.tag_name || github.ref_name }}"
          # 手动触发或分支触发时 ref_name 可能是 master/main，统一兜底为时间戳
          if [ -z "$VERSION" ] || [ "$VERSION" = "master" ] || [ "$VERSION" = "main" ]; then
            VERSION="build-$(date +%Y%m%d-%H%M)"
          fi
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/电视直播-${VERSION}.apk"
          # 固定文件名副本，供 releases/latest/download/电视直播.apk 稳定直链使用
          cp app/build/outputs/apk/debug/app-debug.apk "out/电视直播.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          ls -lh out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.prep.outputs.version }}
          path: out/*.apk
          retention-days: 30

      - name: Attach APK to Release
        # Release 事件或 tag 推送时执行；tag 触发时若 Release 不存在会自动创建
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
