name: Release APK

# 发布版本时自动构建 APK：
#  - 在 GitHub 上创建并发布 Release（published）时触发；
#  - 推送 v* 标签时触发；
#  - 也可在 Actions 页面手动触发（workflow_dispatch）。
on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Prepare artifact
        id: prep
        run: |
          VERSION="${{ github.event.release.tag_name || github.ref_name }}"
          # 手动触发或分支触发时 ref_name 可能是 master/main，统一兜底为时间戳
          if [ -z "$VERSION" ] || [ "$VERSION" = "master" ] || [ "$VERSION" = "main" ]; then
            VERSION="build-$(date +%Y%m%d-%H%M)"
          fi
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/电视直播-${VERSION}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          ls -lh out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.prep.outputs.version }}
          path: out/*.apk
          retention-days: 30

      - name: Attach APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
